<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pipe-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 0.8px; }
    .pipe-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94a3b8; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #00f2fe; letter-spacing: 0.5px; }
    .step-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #cbd5e1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #34d399; }
    .tech-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect width="1080" height="500" rx="16" fill="url(#pipeBg)"/>
  <rect width="1080" height="500" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="135" height="26" rx="13" fill="#2563eb" opacity="0.2"/>
    <rect x="0" y="0" width="135" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="67" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#93c5fd" text-anchor="middle">GITHUB ACTIONS</text>

    <rect x="145" y="0" width="120" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="145" y="0" width="120" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="205" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">STATUS: PASSING</text>

    <rect x="275" y="0" width="120" height="26" rx="13" fill="#8b5cf6" opacity="0.2"/>
    <rect x="275" y="0" width="120" height="26" rx="13" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="335" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#c4b5fd" text-anchor="middle">5 GATED STAGES</text>

    <text x="0" y="58" class="pipe-title">AEGIS DEVSECOPS CI/CD AUTOMATED PIPELINE</text>
    <text x="0" y="78" class="pipe-subtitle">AUTOMATED STATIC ANALYSIS, AQUA TRIVY SECURITY GATES &amp; CLUSTER DEPLOYMENT</text>
    
    <line x1="0" y1="92" x2="1000" y2="92" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Row 1: Trigger + Stage 1, 2, 3, 4, 5 -->
  <!-- Trigger Event Pill -->
  <g transform="translate(40, 145)">
    <rect width="125" height="55" rx="8" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="14" y="24" class="step-num">TRIGGER</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#fff">push ➔ main</text>
  </g>

  <!-- Connection Line -->
  <path d="M 165,172 L 195,172" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="195,172 186,167 186,177" fill="#3b82f6"/>

  <!-- Stage 1 -->
  <g transform="translate(195, 115)">
    <rect width="165" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 01</text>
    <rect x="105" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Code Quality</text>
    <line x1="14" y1="62" x2="151" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Flake8 Linting</text>
    <text x="14" y="104" class="step-detail">• PEP8 Compliance</text>
    <text x="14" y="124" class="step-detail">• AST Validation</text>
    <text x="14" y="145" class="tech-pill">tool: flake8</text>
  </g>

  <!-- Arrow -->
  <path d="M 360,192 L 385,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="385,192 377,187 377,197" fill="#10b981"/>

  <!-- Stage 2 -->
  <g transform="translate(385, 115)">
    <rect width="165" height="155" rx="10" fill="url(#cardGrad2)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num" fill="#f87171">STAGE 02</text>
    <rect x="95" y="7" width="60" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="125" y="20" class="badge" text-anchor="middle">0 CVE</text>

    <text x="14" y="54" class="step-name">Security Gate</text>
    <line x1="14" y1="62" x2="151" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Aqua Trivy FS</text>
    <text x="14" y="104" class="step-detail">• CVE Scan</text>
    <text x="14" y="124" class="step-detail">• Secret Audit</text>
    <text x="14" y="145" class="tech-pill" fill="#f87171">tool: trivy</text>
  </g>

  <!-- Arrow -->
  <path d="M 550,192 L 575,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="575,192 567,187 567,197" fill="#10b981"/>

  <!-- Stage 3 -->
  <g transform="translate(575, 115)">
    <rect width="165" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 03</text>
    <rect x="105" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">Container Hardening</text>
    <line x1="14" y1="62" x2="151" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Multi-Stage Build</text>
    <text x="14" y="104" class="step-detail">• Non-Root UID 10001</text>
    <text x="14" y="124" class="step-detail">• Minimal Surface</text>
    <text x="14" y="145" class="tech-pill">tool: docker buildx</text>
  </g>

  <!-- Arrow -->
  <path d="M 740,192 L 765,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="765,192 757,187 757,197" fill="#10b981"/>

  <!-- Stage 4 -->
  <g transform="translate(765, 115)">
    <rect width="165" height="155" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="32" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="21" class="step-num">STAGE 04</text>
    <rect x="105" y="7" width="50" height="18" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="20" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="54" class="step-name">K8s Validation</text>
    <line x1="14" y1="62" x2="151" y2="62" stroke="#334155" stroke-width="1"/>
    <text x="14" y="84" class="step-detail">• Manifest Schema</text>
    <text x="14" y="104" class="step-detail">• RBAC Principle</text>
    <text x="14" y="124" class="step-detail">• Controller Lint</text>
    <text x="14" y="145" class="tech-pill">tool: kubectl / kind</text>
  </g>

  <!-- Arrow -->
  <path d="M 930,192 L 955,192" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="955,192 947,187 947,197" fill="#10b981"/>

  <!-- Stage 5: Release -->
  <g transform="translate(955, 115)">
    <rect width="85" height="155" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="85" height="32" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="42" y="21" class="step-num" fill="#34d399" text-anchor="middle">LIVE</text>
    <text x="42" y="65" class="step-name" font-size="14" text-anchor="middle" fill="#34d399">Deploy</text>
    <text x="42" y="90" font-size="28" text-anchor="middle">🚀</text>
    <text x="42" y="125" class="step-detail" font-size="11" text-anchor="middle">Render</text>
    <text x="42" y="145" class="badge" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Bottom Highlights Banner -->
  <g transform="translate(40, 305)">
    <rect width="1000" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="36" rx="12" fill="#1e293b" opacity="0.6"/>
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">🛡️ DEVSECOPS SECURITY STANDARDS &amp; AUTOMATION POLICIES</text>

    <!-- 3 Highlight Columns -->
    <g transform="translate(25, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">🔒 Shift-Left Vulnerability Gates</text>
      <text x="0" y="42" class="step-detail" fill="#94a3b8">Every commit undergoes automated static analysis with Flake8</text>
      <text x="0" y="62" class="step-detail" fill="#94a3b8">and deep CVE filesystem scanning using Aqua Security Trivy.</text>
      <text x="0" y="82" class="tech-pill" fill="#34d399">Policy: Zero CRITICAL or HIGH CVEs Allowed</text>
    </g>

    <g transform="translate(360, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">🐳 Process Sandboxing &amp; Least Privilege</text>
      <text x="0" y="42" class="step-detail" fill="#94a3b8">Multi-stage Alpine base builds drop all unnecessary binaries.</text>
      <text x="0" y="62" class="step-detail" fill="#94a3b8">Container runs strictly under unprivileged non-root UID 10001.</text>
      <text x="0" y="82" class="tech-pill" fill="#34d399">Standard: Non-Root Execution | Read-Only Root</text>
    </g>

    <g transform="translate(710, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#f8fafc">⚡ Continuous Live Delivery</text>
      <text x="0" y="42" class="step-detail" fill="#94a3b8">Passing builds trigger instant rolling deployment to live cloud</text>
      <text x="0" y="62" class="step-detail" fill="#94a3b8">endpoints with active health probe verification.</text>
      <text x="0" y="82" class="tech-pill" fill="#00f2fe">Cloud Target: 24/7 Render Web Service</text>
    </g>
  </g>
</svg>
