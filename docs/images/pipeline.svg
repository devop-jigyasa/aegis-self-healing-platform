<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pipe-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 27px; fill: #ffffff; letter-spacing: 0.8px; }
    .pipe-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #94a3b8; letter-spacing: 0.5px; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13.5px; fill: #00f2fe; letter-spacing: 0.5px; }
    .step-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #f8fafc; }
    .step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 14px; fill: #cbd5e1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #34d399; }
    .tech-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect width="1080" height="520" rx="16" fill="url(#pipeBg)"/>
  <rect width="1080" height="520" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header -->
  <g transform="translate(40, 26)">
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#2563eb" opacity="0.2"/>
    <rect x="0" y="0" width="145" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="72" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#93c5fd" text-anchor="middle">GITHUB ACTIONS</text>

    <rect x="155" y="0" width="130" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="155" y="0" width="130" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">STATUS: PASSING</text>

    <rect x="295" y="0" width="130" height="26" rx="13" fill="#8b5cf6" opacity="0.2"/>
    <rect x="295" y="0" width="130" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="360" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#c4b5fd" text-anchor="middle">5 GATED STAGES</text>

    <text x="0" y="60" class="pipe-title">AEGIS DEVSECOPS CI/CD AUTOMATED PIPELINE</text>
    <text x="0" y="82" class="pipe-subtitle">AUTOMATED STATIC ANALYSIS, AQUA TRIVY SECURITY GATES &amp; CLOUD DELIVERY</text>
    
    <line x1="0" y1="94" x2="1000" y2="94" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Row: Trigger + Stage 1, 2, 3, 4, 5 -->
  <!-- Trigger Event Pill -->
  <g transform="translate(40, 145)">
    <rect width="130" height="60" rx="10" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="14" y="26" class="step-num">TRIGGER</text>
    <text x="14" y="48" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#fff">push ➔ main</text>
  </g>

  <!-- Arrow -->
  <path d="M 170,175 L 198,175" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="198,175 189,170 189,180" fill="#3b82f6"/>

  <!-- Stage 1 -->
  <g transform="translate(198, 118)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 01</text>
    <rect x="102" y="7" width="52" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="128" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">Code Quality</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Flake8 Linting</text>
    <text x="14" y="112" class="step-detail">• PEP8 Standard</text>
    <text x="14" y="134" class="step-detail">• AST Validation</text>
    <text x="14" y="154" class="tech-pill">tool: flake8</text>
  </g>

  <!-- Arrow -->
  <path d="M 363,200 L 388,200" stroke="#10b981" stroke-width="3"/>
  <polygon points="388,200 380,195 380,205" fill="#10b981"/>

  <!-- Stage 2 -->
  <g transform="translate(388, 118)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num" fill="#f87171">STAGE 02</text>
    <rect x="94" y="7" width="60" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="124" y="21" class="badge" text-anchor="middle">0 CVE</text>

    <text x="14" y="58" class="step-name">Security Gate</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Aqua Trivy FS</text>
    <text x="14" y="112" class="step-detail">• CVE Vulnerability</text>
    <text x="14" y="134" class="step-detail">• Secret Detection</text>
    <text x="14" y="154" class="tech-pill" fill="#f87171">tool: trivy</text>
  </g>

  <!-- Arrow -->
  <path d="M 553,200 L 578,200" stroke="#10b981" stroke-width="3"/>
  <polygon points="578,200 570,195 570,205" fill="#10b981"/>

  <!-- Stage 3 -->
  <g transform="translate(578, 118)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 03</text>
    <rect x="102" y="7" width="52" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="128" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">Hardened Build</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Multi-Stage Build</text>
    <text x="14" y="112" class="step-detail">• Non-Root 10001</text>
    <text x="14" y="134" class="step-detail">• Minimal Surface</text>
    <text x="14" y="154" class="tech-pill">tool: buildx</text>
  </g>

  <!-- Arrow -->
  <path d="M 743,200 L 768,200" stroke="#10b981" stroke-width="3"/>
  <polygon points="768,200 760,195 760,205" fill="#10b981"/>

  <!-- Stage 4 -->
  <g transform="translate(768, 118)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 04</text>
    <rect x="102" y="7" width="52" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="128" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">K8s Validation</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Manifest Schema</text>
    <text x="14" y="112" class="step-detail">• RBAC Verification</text>
    <text x="14" y="134" class="step-detail">• Controller Lint</text>
    <text x="14" y="154" class="tech-pill">tool: kubectl</text>
  </g>

  <!-- Arrow -->
  <path d="M 933,200 L 956,200" stroke="#10b981" stroke-width="3"/>
  <polygon points="956,200 948,195 948,205" fill="#10b981"/>

  <!-- Stage 5: Release -->
  <g transform="translate(956, 118)">
    <rect width="84" height="165" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="84" height="34" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="42" y="22" class="step-num" fill="#34d399" text-anchor="middle">LIVE</text>
    <text x="42" y="68" class="step-name" font-size="14" text-anchor="middle" fill="#34d399">Deploy</text>
    <text x="42" y="98" font-size="28" text-anchor="middle">🚀</text>
    <text x="42" y="132" class="step-detail" font-size="12" text-anchor="middle">Render</text>
    <text x="42" y="152" class="badge" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Bottom Highlights Banner -->
  <g transform="translate(40, 310)">
    <rect width="1000" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="40" rx="12" fill="#1e293b" opacity="0.6"/>
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#38bdf8">🛡️ DEVSECOPS SECURITY STANDARDS &amp; AUTOMATION POLICIES</text>

    <!-- 3 Highlight Columns with Larger 14px Typography -->
    <g transform="translate(25, 55)">
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="15.5" fill="#f8fafc">🔒 Shift-Left Vulnerability Gates</text>
      <text x="0" y="46" class="step-detail" fill="#cbd5e1">Every commit undergoes automated static analysis with Flake8</text>
      <text x="0" y="68" class="step-detail" fill="#cbd5e1">and deep CVE filesystem scanning using Aqua Security Trivy.</text>
      <text x="0" y="92" class="tech-pill" fill="#34d399">Policy: Zero CRITICAL or HIGH CVEs Allowed</text>
    </g>

    <g transform="translate(365, 55)">
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="15.5" fill="#f8fafc">🐳 Sandboxing &amp; Least Privilege</text>
      <text x="0" y="46" class="step-detail" fill="#cbd5e1">Multi-stage Python slim builds drop all unnecessary tools.</text>
      <text x="0" y="68" class="step-detail" fill="#cbd5e1">Containers execute under unprivileged non-root UID 10001.</text>
      <text x="0" y="92" class="tech-pill" fill="#34d399">Standard: Non-Root Execution | Read-Only Root</text>
    </g>

    <g transform="translate(720, 55)">
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="15.5" fill="#f8fafc">⚡ Continuous Live Delivery</text>
      <text x="0" y="46" class="step-detail" fill="#cbd5e1">Passing builds trigger instant rolling deployment to live cloud</text>
      <text x="0" y="68" class="step-detail" fill="#cbd5e1">endpoints with active health probe verification.</text>
      <text x="0" y="92" class="tech-pill" fill="#00f2fe">Cloud Target: 24/7 Render Web Service</text>
    </g>
  </g>
</svg>
