<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pipe-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 0.8px; }
    .pipe-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94a3b8; letter-spacing: 0.5px; }
    .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: #00f2fe; letter-spacing: 0.5px; }
    .step-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .step-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #cbd5e1; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #34d399; }
    .tech-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect width="1080" height="530" rx="16" fill="url(#pipeBg)"/>
  <rect width="1080" height="530" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#2563eb" opacity="0.2"/>
    <rect x="0" y="0" width="145" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="72" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#93c5fd" text-anchor="middle">GITHUB ACTIONS</text>

    <rect x="155" y="0" width="130" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="155" y="0" width="130" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#34d399" text-anchor="middle">STATUS: PASSING</text>

    <rect x="295" y="0" width="130" height="26" rx="13" fill="#8b5cf6" opacity="0.2"/>
    <rect x="295" y="0" width="130" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="360" y="17" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#c4b5fd" text-anchor="middle">5 GATED STAGES</text>

    <text x="0" y="58" class="pipe-title">AEGIS DEVSECOPS CI/CD AUTOMATED PIPELINE</text>
    <text x="0" y="78" class="pipe-subtitle">AUTOMATED STATIC ANALYSIS, AQUA TRIVY SECURITY GATES &amp; CLOUD DELIVERY</text>
    
    <line x1="0" y1="90" x2="1000" y2="90" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Row: Trigger + Stage 1, 2, 3, 4, 5 -->
  <!-- Trigger Event Pill -->
  <g transform="translate(40, 138)">
    <rect width="125" height="60" rx="10" fill="#131e36" stroke="#2563eb" stroke-width="2"/>
    <text x="14" y="25" class="step-num">TRIGGER</text>
    <text x="14" y="47" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5" fill="#fff">push ➔ main</text>
  </g>

  <!-- Arrow -->
  <path d="M 165,168 L 195,168" stroke="#3b82f6" stroke-width="3"/>
  <polygon points="195,168 186,163 186,173" fill="#3b82f6"/>

  <!-- Stage 1 -->
  <g transform="translate(195, 112)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 01</text>
    <rect x="105" y="7" width="50" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">Code Quality</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Flake8 Linting</text>
    <text x="14" y="112" class="step-detail">• PEP8 Standard</text>
    <text x="14" y="134" class="step-detail">• AST Validation</text>
    <text x="14" y="154" class="tech-pill" fill="#38bdf8">tool: flake8</text>
  </g>

  <!-- Arrow -->
  <path d="M 360,195 L 385,195" stroke="#10b981" stroke-width="3"/>
  <polygon points="385,195 377,190 377,200" fill="#10b981"/>

  <!-- Stage 2 -->
  <g transform="translate(385, 112)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num" fill="#f87171">STAGE 02</text>
    <rect x="98" y="7" width="57" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="126" y="21" class="badge" text-anchor="middle">0 CVE</text>

    <text x="14" y="58" class="step-name">Security Gate</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Aqua Trivy FS</text>
    <text x="14" y="112" class="step-detail">• CVE Vulnerability</text>
    <text x="14" y="134" class="step-detail">• Secret Detection</text>
    <text x="14" y="154" class="tech-pill" fill="#f87171">tool: trivy</text>
  </g>

  <!-- Arrow -->
  <path d="M 550,195 L 575,195" stroke="#10b981" stroke-width="3"/>
  <polygon points="575,195 567,190 567,200" fill="#10b981"/>

  <!-- Stage 3 -->
  <g transform="translate(575, 112)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 03</text>
    <rect x="105" y="7" width="50" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">Hardened Build</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Multi-Stage Build</text>
    <text x="14" y="112" class="step-detail">• Non-Root 10001</text>
    <text x="14" y="134" class="step-detail">• Minimal Surface</text>
    <text x="14" y="154" class="tech-pill" fill="#38bdf8">tool: buildx</text>
  </g>

  <!-- Arrow -->
  <path d="M 740,195 L 765,195" stroke="#10b981" stroke-width="3"/>
  <polygon points="765,195 757,190 757,200" fill="#10b981"/>

  <!-- Stage 4 -->
  <g transform="translate(765, 112)">
    <rect width="165" height="165" rx="10" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="34" rx="10" fill="#1e293b" opacity="0.7"/>
    <text x="14" y="22" class="step-num">STAGE 04</text>
    <rect x="105" y="7" width="50" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="130" y="21" class="badge" text-anchor="middle">PASS</text>

    <text x="14" y="58" class="step-name">K8s Validation</text>
    <line x1="14" y1="66" x2="151" y2="66" stroke="#334155" stroke-width="1"/>
    <text x="14" y="90" class="step-detail">• Manifest Schema</text>
    <text x="14" y="112" class="step-detail">• RBAC Principle</text>
    <text x="14" y="134" class="step-detail">• Controller Lint</text>
    <text x="14" y="154" class="tech-pill" fill="#38bdf8">tool: kubectl</text>
  </g>

  <!-- Arrow -->
  <path d="M 930,195 L 955,195" stroke="#10b981" stroke-width="3"/>
  <polygon points="955,195 947,190 947,200" fill="#10b981"/>

  <!-- Stage 5: Release -->
  <g transform="translate(955, 112)">
    <rect width="85" height="165" rx="10" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="85" height="34" rx="10" fill="#10b981" opacity="0.2"/>
    <text x="42" y="22" class="step-num" fill="#34d399" text-anchor="middle">LIVE</text>
    <text x="42" y="68" class="step-name" font-size="14" text-anchor="middle" fill="#34d399">Deploy</text>
    <text x="42" y="98" font-size="28" text-anchor="middle">🚀</text>
    <text x="42" y="132" class="step-detail" font-size="12" text-anchor="middle">Render</text>
    <text x="42" y="152" class="badge" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Bottom Highlights Banner (Spaced to avoid any horizontal text overlap) -->
  <g transform="translate(40, 305)">
    <rect width="1000" height="195" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="1000" height="38" rx="12" fill="#1e293b" opacity="0.6"/>
    <text x="20" y="25" font-family="-apple-system, sans-serif" font-weight="700" font-size="14.5" fill="#38bdf8">🛡️ DEVSECOPS SECURITY STANDARDS &amp; AUTOMATION POLICIES</text>

    <!-- Column 1: Vulnerability Gates (width: 300) -->
    <g transform="translate(25, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">🔒 Vulnerability Gates</text>
      <text x="0" y="44" class="step-detail">• Flake8 static analysis &amp; linting</text>
      <text x="0" y="66" class="step-detail">• Aqua Security Trivy CVE scans</text>
      <text x="0" y="88" class="step-detail">• Secret &amp; token leak detection</text>
      <text x="0" y="114" class="tech-pill" fill="#34d399">Gate: Zero CRITICAL/HIGH CVEs</text>
    </g>

    <!-- Divider 1 -->
    <line x1="335" y1="48" x2="335" y2="178" stroke="#334155" stroke-width="1"/>

    <!-- Column 2: Sandboxing (width: 300) -->
    <g transform="translate(360, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">🐳 Process Sandboxing</text>
      <text x="0" y="44" class="step-detail">• Multi-stage minimal container build</text>
      <text x="0" y="66" class="step-detail">• Unprivileged user (UID 10001)</text>
      <text x="0" y="88" class="step-detail">• Disallow privilege escalation</text>
      <text x="0" y="114" class="tech-pill" fill="#34d399">Standard: Non-Root Execution</text>
    </g>

    <!-- Divider 2 -->
    <line x1="685" y1="48" x2="685" y2="178" stroke="#334155" stroke-width="1"/>

    <!-- Column 3: Continuous Delivery (width: 300) -->
    <g transform="translate(710, 52)">
      <text x="0" y="18" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#f8fafc">⚡ Continuous Delivery</text>
      <text x="0" y="44" class="step-detail">• Automated rolling cloud release</text>
      <text x="0" y="66" class="step-detail">• Active /healthz verification gate</text>
      <text x="0" y="88" class="step-detail">• Zero-downtime rolling update</text>
      <text x="0" y="114" class="tech-pill" fill="#00f2fe">Target: 24/7 Live Cloud Preview</text>
    </g>
  </g>
</svg>
