<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardGradCb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="cbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .cb-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 0.8px; }
    .cb-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #94a3b8; letter-spacing: 0.5px; }
    .card-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #f8fafc; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13.5px; fill: #38bdf8; }
    .card-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #cbd5e1; }
    .badge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11.5px; }
    .code-pill { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Container -->
  <rect width="1080" height="500" rx="16" fill="url(#cbBg)"/>
  <rect width="1080" height="500" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Subtle Architectural Grid -->
  <g opacity="0.04">
    <path d="M 0,70 L 1080,70 M 0,140 L 1080,140 M 0,210 L 1080,210 M 0,280 L 1080,280 M 0,350 L 1080,350 M 0,420 L 1080,420" stroke="#00f2fe" stroke-width="1.5"/>
    <path d="M 70,0 L 70,500 M 140,0 L 140,500 M 210,0 L 210,500 M 280,0 L 280,500 M 350,0 L 350,500 M 420,0 L 420,500 M 490,0 L 490,500 M 560,0 L 560,500 M 630,0 L 630,500 M 700,0 L 700,500 M 770,0 L 770,500 M 840,0 L 840,500 M 910,0 L 910,500 M 980,0 L 980,500" stroke="#00f2fe" stroke-width="1.5"/>
  </g>

  <!-- Top Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#10b981" opacity="0.2"/>
    <rect x="0" y="0" width="145" height="26" rx="13" fill="none" stroke="#10b981" stroke-width="1.2"/>
    <text x="72" y="17" class="badge-label" text-anchor="middle" fill="#34d399">⚡ STATE MACHINE</text>

    <rect x="155" y="0" width="135" height="26" rx="13" fill="#00f2fe" opacity="0.15"/>
    <rect x="155" y="0" width="135" height="26" rx="13" fill="none" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="222" y="17" class="badge-label" text-anchor="middle" fill="#00f2fe">⏱️ 600s WINDOW</text>

    <rect x="300" y="0" width="145" height="26" rx="13" fill="#8b5cf6" opacity="0.2"/>
    <rect x="300" y="0" width="145" height="26" rx="13" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="372" y="17" class="badge-label" text-anchor="middle" fill="#c4b5fd">🛡️ MAX 3 ATTEMPTS</text>

    <rect x="455" y="0" width="145" height="26" rx="13" fill="#f59e0b" opacity="0.2"/>
    <rect x="455" y="0" width="145" height="26" rx="13" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="527" y="17" class="badge-label" text-anchor="middle" fill="#fbbf24">⏳ 25s COOLDOWN</text>

    <text x="0" y="58" class="cb-title">DISTRIBUTED SRE CIRCUIT BREAKER ENGINE</text>
    <text x="0" y="78" class="cb-subtitle">FINITE-STATE AUTOMATON PREVENTING CASCADING REMEDIATION FLAPPING &amp; RESTART LOOPS</text>
    
    <line x1="0" y1="90" x2="1000" y2="90" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- 3 CORE PILLARS: CLOSED (Safe) -> EVALUATOR -> OPEN (Tripped) -->
  
  <!-- Pillar 1: CLOSED STATE (Left: width=300, height=210) -->
  <g transform="translate(40, 125)">
    <rect width="300" height="210" rx="12" fill="url(#cardGradCb)" stroke="#10b981" stroke-width="2" filter="url(#cbShadow)"/>
    <rect x="0" y="0" width="300" height="38" rx="12" fill="#10b981" opacity="0.2"/>
    <text x="16" y="24" class="card-head" fill="#34d399">1. CLOSED (Normal)</text>
    <rect x="218" y="8" width="70" height="22" rx="11" fill="#10b981"/>
    <text x="253" y="23" class="badge-label" text-anchor="middle" fill="#fff">ACTIVE</text>

    <text x="16" y="62" class="card-sub">• Automated Healing Active</text>
    <line x1="16" y1="72" x2="284" y2="72" stroke="#334155" stroke-width="1"/>

    <text x="16" y="94" class="card-txt">✔ Prometheus alert intercepted</text>
    <text x="16" y="116" class="card-txt">✔ Rolling rollout / memory patched</text>
    <text x="16" y="138" class="card-txt">✔ Active polling validates HTTP 200</text>
    
    <rect x="16" y="158" width="268" height="32" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="150" y="179" class="code-pill" text-anchor="middle" fill="#34d399">Status: Remediations Approved</text>
  </g>

  <!-- Flow Arrow from Closed to Gate -->
  <g stroke-linecap="round">
    <path d="M 340,230 L 375,230" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <polygon points="375,230 366,225 366,235" fill="#00f2fe"/>
  </g>

  <!-- Pillar 2: GUARDRAIL EVALUATION GATE (Center: width=320, height=210) -->
  <g transform="translate(380, 125)">
    <rect width="320" height="210" rx="12" fill="url(#cardGradCb)" stroke="#00f2fe" stroke-width="2" filter="url(#cbShadow)"/>
    <rect x="0" y="0" width="320" height="38" rx="12" fill="#00f2fe" opacity="0.15"/>
    <text x="16" y="24" class="card-head" fill="#00f2fe">2. Guardrail Gate</text>
    <rect x="238" y="8" width="70" height="22" rx="11" fill="#00f2fe" opacity="0.3"/>
    <text x="273" y="23" class="badge-label" text-anchor="middle" fill="#00f2fe">AUDIT</text>

    <text x="16" y="62" class="card-sub">• Real-Time Safety Checks:</text>
    <line x1="16" y1="72" x2="304" y2="72" stroke="#334155" stroke-width="1"/>

    <text x="16" y="94" class="card-txt">1. Action Limit: &lt; 3 attempts in 10m</text>
    <text x="16" y="116" class="card-txt">2. Cooldown Guard: &gt;= 25s elapsed</text>
    <text x="16" y="138" class="card-txt">3. Node Health: Stable control plane</text>

    <!-- Branch indicators -->
    <rect x="16" y="156" width="138" height="36" rx="6" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="85" y="179" class="code-pill" text-anchor="middle" fill="#34d399">SAFE ➔ CLOSED</text>

    <rect x="166" y="156" width="138" height="36" rx="6" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="1"/>
    <text x="235" y="179" class="code-pill" text-anchor="middle" fill="#f87171">TRIP ➔ OPEN</text>
  </g>

  <!-- Flow Arrow from Gate to Tripped -->
  <g stroke-linecap="round">
    <path d="M 700,230 L 735,230" fill="none" stroke="#ef4444" stroke-width="3"/>
    <polygon points="735,230 726,225 726,235" fill="#ef4444"/>
  </g>

  <!-- Pillar 3: TRIPPED / OPEN STATE (Right: width=300, height=210) -->
  <g transform="translate(740, 125)">
    <rect width="300" height="210" rx="12" fill="url(#cardGradCb)" stroke="#ef4444" stroke-width="2" filter="url(#cbShadow)"/>
    <rect x="0" y="0" width="300" height="38" rx="12" fill="#ef4444" opacity="0.2"/>
    <text x="16" y="24" class="card-head" fill="#f87171">3. OPEN (Tripped)</text>
    <rect x="218" y="8" width="70" height="22" rx="11" fill="#ef4444"/>
    <text x="253" y="23" class="badge-label" text-anchor="middle" fill="#fff">LOCKED</text>

    <text x="16" y="62" class="card-sub">• Circuit Protection Active</text>
    <line x1="16" y1="72" x2="284" y2="72" stroke="#334155" stroke-width="1"/>

    <text x="16" y="94" class="card-txt">🛑 Halts automated rolling restarts</text>
    <text x="16" y="116" class="card-txt">📑 Correlates pod logs &amp; outputs RCA</text>
    <text x="16" y="138" class="card-txt">🚨 Dispatches on-call alert webhook</text>

    <rect x="16" y="158" width="268" height="32" rx="6" fill="#ef4444" opacity="0.15"/>
    <text x="150" y="179" class="code-pill" text-anchor="middle" fill="#f87171">Status: Action Blocked (Safe)</text>
  </g>

  <!-- Bottom Strip: State Transitions Summary -->
  <g transform="translate(40, 360)">
    <rect width="1000" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- State 1 Summary -->
    <g transform="translate(25, 18)">
      <circle cx="10" cy="12" r="7" fill="#10b981"/>
      <text x="26" y="17" class="card-head" font-size="14.5" fill="#34d399">CLOSED (Nominal)</text>
      <text x="26" y="40" class="card-txt">Automated self-healing active.</text>
      <text x="26" y="60" class="card-txt">Sub-25s MTTR verified via probes.</text>
      <text x="26" y="80" class="code-pill" fill="#10b981">Actions: Allowed (Window &lt; 3)</text>
    </g>

    <line x1="330" y1="16" x2="330" y2="94" stroke="#334155" stroke-width="1"/>

    <!-- State 2 Summary -->
    <g transform="translate(355, 18)">
      <circle cx="10" cy="12" r="7" fill="#ef4444"/>
      <text x="26" y="17" class="card-head" font-size="14.5" fill="#f87171">OPEN (Tripped)</text>
      <text x="26" y="40" class="card-txt">Anti-flapping guardrail engaged.</text>
      <text x="26" y="60" class="card-txt">Prevents cluster control plane starvation.</text>
      <text x="26" y="80" class="code-pill" fill="#f87171">Actions: Blocked (Escalated to On-Call)</text>
    </g>

    <line x1="670" y1="16" x2="670" y2="94" stroke="#334155" stroke-width="1"/>

    <!-- State 3 Summary -->
    <g transform="translate(695, 18)">
      <circle cx="10" cy="12" r="7" fill="#f59e0b"/>
      <text x="26" y="17" class="card-head" font-size="14.5" fill="#fbbf24">HALF-OPEN (Recovery)</text>
      <text x="26" y="40" class="card-txt">Cooldown elapsed. Single canary test.</text>
      <text x="26" y="60" class="card-txt">Auto-resets to CLOSED when probes pass.</text>
      <text x="26" y="80" class="code-pill" fill="#fbbf24">Transition: Canary Test ➔ CLOSED</text>
    </g>
  </g>
</svg>
