name: "AEGIS DevSecOps CI Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    name: "Code Quality & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies, Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r app/requirements.txt
          python -m pip install -r controller/requirements.txt

      - name: Run Flake8 Code Quality Scan
        run: |
          # Check for critical syntax errors or undefined names
          python -m flake8 app/ controller/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          # Enforce code style with configured line length and exclusions
          python -m flake8 app/ controller/ tests/ --max-line-length=135 --extend-ignore=E501,E203,W503 --statistics || true

      - name: Run Automated Unit & Integration Tests
        run: |
          python -m pytest tests/ -v

      - name: Validate Kubernetes Manifests
        run: |
          kubectl kustomize k8s/base/ > /dev/null
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f, 'r'))) for f in glob.glob('k8s/**/*.yaml', recursive=True)]; print('All manifests validated successfully.')"

  security-scan:
    name: "Trivy Container & Manifest Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          hide-progress: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-containers:
    name: "Multi-Stage Docker Image Builds"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AEGIS Core Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: |
            aegis-core:1.0.0
            aegis-core:latest

      - name: Build AEGIS Controller Image
        uses: docker/build-push-action@v5
        with:
          context: ./controller
          file: ./controller/Dockerfile
          push: false
          tags: |
            aegis-controller:1.0.0
            aegis-controller:latest
