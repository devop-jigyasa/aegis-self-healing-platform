apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: aegis-system
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/
            - name: prometheus-rules-volume
              mountPath: /etc/prometheus/rules/
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
        - name: prometheus-rules-volume
          configMap:
            name: prometheus-rules
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aegis-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - /etc/prometheus/rules/alert-rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.aegis-system.svc.cluster.local:9093']

    scrape_configs:
      - job_name: 'aegis-core'
        static_configs:
          - targets: ['aegis-core-service.production-apps.svc.cluster.local:8000']
            labels:
              namespace: 'production-apps'
              deployment: 'aegis-core'

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.aegis-system.svc.cluster.local:8080']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: aegis-system
data:
  alert-rules.yaml: |
    groups:
      - name: aegis_sre_alerts
        rules:
          - alert: AegisPodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="production-apps"}[5m]) * 60 > 2
            for: 30s
            labels:
              severity: critical
              deployment: aegis-core
              namespace: production-apps
            annotations:
              summary: "AEGIS Pod is crash-looping in production-apps"
              description: "Pod {{ $labels.pod }} restarted more than 2 times in 5 minutes."

          - alert: AegisContainerOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace="production-apps"} == 1
            for: 0s
            labels:
              severity: critical
              deployment: aegis-core
              namespace: production-apps
            annotations:
              summary: "AEGIS Container was terminated due to OOMKill"
              description: "Container in pod {{ $labels.pod }} exceeded memory limit."

          - alert: AegisHighCPUUsage
            expr: aegis_process_cpu_usage_percent > 85
            for: 1m
            labels:
              severity: warning
              deployment: aegis-core
              namespace: production-apps
            annotations:
              summary: "AEGIS CPU Saturation Exceeded 85%"
              description: "Workload CPU utilization sustained above 85% for 1m."

          - alert: AegisHighErrorRate
            expr: sum(rate(aegis_http_requests_total{status_code="500"}[2m])) / sum(rate(aegis_http_requests_total[2m])) > 0.05
            for: 1m
            labels:
              severity: warning
              deployment: aegis-core
              namespace: production-apps
            annotations:
              summary: "AEGIS High HTTP 500 Error Cascade"
              description: "500 Error rate is greater than 5% over 2 minutes."

          - alert: AegisLatencySLOBreach
            expr: histogram_quantile(0.95, sum(rate(aegis_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
            for: 1m
            labels:
              severity: warning
              deployment: aegis-core
              namespace: production-apps
            annotations:
              summary: "AEGIS p95 Latency SLO breached"
              description: "p95 request duration exceeded 1.5s."
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: aegis-system
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: aegis-system
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.25.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: alertmanager-config-volume
              mountPath: /etc/alertmanager/
      volumes:
        - name: alertmanager-config-volume
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: aegis-system
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m
    route:
      group_by: ['alertname', 'namespace', 'deployment']
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'aegis-remediation-webhook'
    receivers:
      - name: 'aegis-remediation-webhook'
        webhook_configs:
          - url: 'http://aegis-controller.aegis-system.svc.cluster.local:5000/webhook/alert'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials: 'aegis-webhook-shared-secret-key-prod-2026'
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: aegis-system
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: aegis-system
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.9.2
          ports:
            - containerPort: 8080
              name: http-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: aegis-system
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
  selector:
    app: kube-state-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: aegis-system
