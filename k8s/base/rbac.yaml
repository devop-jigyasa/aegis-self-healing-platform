apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-controller-sa
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-remediation-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-remediation-binding
subjects:
  - kind: ServiceAccount
    name: aegis-controller-sa
    namespace: aegis-system
roleRef:
  kind: ClusterRole
  name: aegis-remediation-role
  apiGroup: rbac.authorization.k8s.io
