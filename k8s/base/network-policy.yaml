apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-controller-netpol
  namespace: aegis-system
spec:
  podSelector:
    matchLabels:
      app: aegis-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Alertmanager webhook notifications
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: alertmanager
        # Allow Prometheus metric scrapes
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: prometheus
        # Allow aegis-core microservice in production-apps to query circuit-breaker and incident telemetry
        - namespaceSelector:
            matchLabels:
              name: production-apps
          podSelector:
            matchLabels:
              app: aegis-core
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow Kubernetes API server communication
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow internal DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-core-netpol
  namespace: production-apps
spec:
  podSelector:
    matchLabels:
      app: aegis-core
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
