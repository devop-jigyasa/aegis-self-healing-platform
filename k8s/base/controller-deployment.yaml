apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-controller
  namespace: aegis-system
  labels:
    app: aegis-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-controller
  template:
    metadata:
      labels:
        app: aegis-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aegis-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
      containers:
        - name: controller
          image: aegis-controller:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REPORTS_DIR
              value: "/data"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: WEBHOOK_SECRET
                  optional: true
          volumeMounts:
            - name: incident-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
              name: webhook
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: incident-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-controller
  namespace: aegis-system
  labels:
    app: aegis-controller
spec:
  selector:
    app: aegis-controller
  ports:
    - name: webhook
      port: 5000
      targetPort: 5000
